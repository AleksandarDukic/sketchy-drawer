<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: peachpuff;
        }
    </style>

</head>

<body>
    <canvas id="canvas" width="800" height="800"></canvas>
    <script type="module" src="./index.js"></script>
        <script>
        let canvas = document.getElementById("canvas");
        let ctx = canvas.getContext("2d");
        // Define your organic shape
        ctx.beginPath();
        ctx.moveTo(200, 100);
        ctx.bezierCurveTo(350, 50, 400, 250, 250, 350);
        ctx.bezierCurveTo(100, 400, 50, 200, 200, 100);
        ctx.closePath();

        // Restrict drawing to the shape
        ctx.save();
        ctx.clip();

        // Draw random paint strokes
        for (let i = 0; i < 1000; i++) {
            const x = Math.random() * 400;
            const y = Math.random() * 400;

            ctx.strokeStyle = "rgba(30, 80, 180, 0.15)";
            ctx.lineWidth = 2 + Math.random() * 8;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.random() * 200, y + Math.random() * 10);
            ctx.stroke();
        }

        ctx.restore();
    </script>
</body>

</html>
